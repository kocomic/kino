name: Bug report
description: Report a reproducible Kino defect without exposing private game-library data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach ROMs, BIOS, firmware, keys, tokens, database files, or screenshots containing private paths. Security issues belong in GitHub Private Vulnerability Reporting, not a public issue.
  - type: input
    id: version
    attributes:
      label: Kino version
      description: Paste `kino version --json` or the exact image digest.
      placeholder: 0.2.0-preview.1 or ghcr.io/...@sha256:...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Library and metadata
        - Import source
        - Library export
        - Deployment, backup, or recovery
        - API or protocol
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Use synthetic filenames and redact private identifiers.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS/NAS, architecture, browser/client, deployment mode, platform and frontend versions where relevant.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed ROM data, credentials, private paths and library identifiers.
          required: true
