name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.6'
      - run: go mod verify
      - run: go vet ./...
      - if: runner.os != 'Windows'
        run: go test -race ./...
      - if: runner.os == 'Windows'
        run: go test ./...
      - run: go build ./...
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          test -z "$(gofmt -l cmd internal)"
          ./scripts/check-version.sh
          ./scripts/check-source-hygiene.sh
          ./scripts/check-github-actions-pinning.sh
          ./scripts/test-nas-preflight.sh
          ./scripts/test-render-container-deployment.sh
          ./scripts/check-third-party-notices.sh --go
          ruby -e 'require "yaml"; s=YAML.load_file("internal/server/openapi.yaml"); abort unless s["openapi"] == "3.1.0"'
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.6'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: node --check internal/server/web/app.js
      - run: ./scripts/check-third-party-notices.sh --node
      - run: ./scripts/check-protocol-schemas.sh
      - run: ./scripts/build-api-docs.sh "$RUNNER_TEMP/kino-api-docs"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build -t kino:ci .
      - run: ./scripts/smoke-rom-container.sh kino:ci
