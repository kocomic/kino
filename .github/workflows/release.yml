name: Publish ROM release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.6'
      - shell: bash
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(cat internal/buildinfo/VERSION)"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          ./scripts/check-version.sh
          ./scripts/check-third-party-notices.sh --go
      - run: go test -race ./...
      - run: go vet ./...
      - shell: bash
        run: |
          mkdir dist
          ./scripts/collect-third-party-licenses.sh dist/licenses --go-only
          cp LICENSE dist/LICENSE
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            os=${target%/*}
            arch=${target#*/}
            suffix=""
            if test "$os" = windows; then suffix=.exe; fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags='-s -w' -o "dist/kino-$os-$arch$suffix" ./cmd/kino
          done
          tar -czf dist/THIRD_PARTY_LICENSES.tar.gz -C dist licenses LICENSE
          cd dist
          sha256sum kino-* THIRD_PARTY_LICENSES.tar.gz LICENSE > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kino-rom-release
          path: dist
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kino-rom-release
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace published assets.' >&2
            exit 1
          fi
          args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${args[@]}" dist/kino-* dist/THIRD_PARTY_LICENSES.tar.gz dist/LICENSE dist/SHA256SUMS
