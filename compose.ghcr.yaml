name: kino

services:
  app:
    image: "${KINO_IMAGE:?Set KINO_IMAGE to a published GHCR or Docker Hub tag or digest}"
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    environment:
      GAME_LIBRARY_TOKEN: "${GAME_LIBRARY_TOKEN:?Set GAME_LIBRARY_TOKEN to a private random secret}"
      TZ: "${TZ:-Asia/Shanghai}"
    ports:
      - "${KINO_BIND:-0.0.0.0}:${KINO_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: "${KINO_DATA_PATH:?Set KINO_DATA_PATH to an existing absolute local NAS path}"
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: "${ROM_LIBRARY_PATH:?Set ROM_LIBRARY_PATH to an existing absolute ROM directory}"
        target: /library
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
