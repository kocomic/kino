        id: {type: string, pattern: '^[a-f0-9]{32}$', description: "Identity bound to kind, relative path, size, mode, and modification time."}
        storage_kind: {type: string, enum: [rom, media]}
        relative_path: {type: string, description: Path relative to the selected service-managed root; never a host-absolute path.}
        size: {type: integer, format: int64, minimum: 0}
        modified_at: {type: string, format: date-time}
    ManagedCleanupPreview:
      type: object
      required: [preview_token, fingerprint, candidates, total_bytes]
      properties:
        preview_token: {type: string, minLength: 32}
        fingerprint: {type: string, pattern: '^[a-f0-9]{64}$'}
        candidates: {type: array, maxItems: 50000, items: {$ref: '#/components/schemas/ManagedCleanupCandidate'}}
        total_bytes: {type: integer, format: int64, minimum: 0}
    ManagedCleanupCommitRequest:
      type: object
      required: [preview_token, selected_ids]
