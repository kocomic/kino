      properties:
        preview_token: {type: string, minLength: 32}
        selected_ids: {type: array, minItems: 1, maxItems: 50000, uniqueItems: true, items: {type: string, pattern: '^[a-f0-9]{32}$'}}
    ManagedCleanupRun:
      type: object
      required: [id, status, item_count, total_bytes, created_at]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [prepared, quarantined, restored]}
        item_count: {type: integer, minimum: 1}
        total_bytes: {type: integer, format: int64, minimum: 0}
        created_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
    ManagedCleanupRunCollection:
      allOf:
        - {$ref: '#/components/schemas/PaginatedBase'}
        - {type: object, properties: {data: {type: array, items: {$ref: '#/components/schemas/ManagedCleanupRun'}}}}
    APIRoot:
      type: object
      required: [name, api_version, service_version, links]
      properties:
        name: {type: string}
        api_version: {type: string, const: v1}
        service_version: {type: string}
        links: {type: object, additionalProperties: {type: string}}
    HealthLive:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, const: ok}
    HealthReady:
      type: object
      additionalProperties: false
      required: [status, schema_version, supported_schema_version]
      properties:
        status: {type: string, const: ready}
        schema_version: {type: integer, minimum: 1}
        supported_schema_version: {type: integer, minimum: 1}
    ImportSource:
      type: object
      additionalProperties: false
      required: [format, path, platform, size, modified_at]
      properties:
        format: {type: string, enum: [pegasus, es-de, kino]}
        path: {type: string, description: Library-root-relative metadata path.}
        platform: {type: string, description: "Canonical platform ID, or empty for a multi-platform Kino manifest."}
        size: {type: integer, format: int64, minimum: 0}
        modified_at: {type: string, format: date-time}
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: {type: string, description: Stable machine-readable error code used for client branching.}
            message: {type: string, description: Human-readable diagnostic; clients must not parse this value.}
            request_id: {type: string, description: Correlation identity also returned in the X-Request-ID header.}
    Pagination:
      type: object
      additionalProperties: false
      description: Offset page metadata. Repeat the same filters and ordering while advancing offset by the number of returned records.
      required: [limit, offset, total]
      properties:
        limit: {type: integer, minimum: 1, maximum: 200}
        offset: {type: integer, minimum: 0}
        total: {type: integer, minimum: 0}
    GameMutation:
      type: object
      additionalProperties: false
      required: [default_title, platform]
      properties:
        id: {type: string, description: Optional caller-generated identity on create; ignored on update.}
        default_title: {type: string, minLength: 1}
        platform: {type: string, minLength: 1, description: Canonical platform ID or registered alias.}
        titles: {type: object, additionalProperties: {type: string}}
    PrimaryEditionRequest:
      type: object
      additionalProperties: false
      required: [edition_id]
      properties:
        edition_id: {type: string, minLength: 1}
    EditionMutation:
      type: object
      additionalProperties: false
      required: [game_id, default_title, edition_type]
      properties:
        id: {type: string, description: Optional caller-generated identity on create; ignored on update.}
        game_id: {type: string, minLength: 1}
        default_title: {type: string, minLength: 1}
        edition_type: {type: string, enum: [original, translation, hack, revision, homebrew, other]}
        version: {type: string}
        languages: {type: array, uniqueItems: true, items: {type: string}}
        author: {type: string}
        serial: {type: string}
        product_code: {type: string}
        title_id: {type: string}
        sort_order: {type: integer}
        titles: {type: object, additionalProperties: {type: string}}
    EditionMoveRequest:
      type: object
      additionalProperties: false
      required: [target_game_id]
      properties:
        target_game_id: {type: string, minLength: 1}
    ArtifactCreateRequest:
      type: object
      additionalProperties: false
      required: [edition_id, path]
      properties:
        id: {type: string, description: Optional caller-generated identity.}
        edition_id: {type: string, minLength: 1}
        path: {type: string, minLength: 1, description: Existing path below the configured library root.}
        role: {type: string, enum: [rom, disc, executable, patch, dlc, update, other], default: rom}
        disc_index: {type: integer, minimum: 0, maximum: 64}
    ArtifactUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        path: {type: string, description: Required for referenced artifacts; managed artifact paths are immutable.}
        role: {type: string, enum: [rom, disc, executable, patch, dlc, update, other], default: rom}
        disc_index: {type: integer, minimum: 0, maximum: 64}
    SourceAdapterMutation:
      type: object
      additionalProperties: false
      required: [name, format, handler]
      properties:
        id: {type: string}
        name: {type: string, minLength: 1}
        format: {type: string, minLength: 1}
        handler: {type: string, enum: [rom_directory, pegasus, esde, kino]}
        contract_version: {type: integer, minimum: 1, default: 1}
        capabilities: {type: object, additionalProperties: {type: boolean}}
        support_level: {$ref: '#/components/schemas/SupportLevel'}
        evidence: {$ref: '#/components/schemas/SupportEvidence'}
        enabled: {type: boolean, default: true}
    FrontendAdapterMutation:
      type: object
      additionalProperties: false
      required: [name, format, handler]
      properties:
        id: {type: string}
        name: {type: string, minLength: 1}
        format: {type: string, minLength: 1}
        handler: {type: string, enum: ['', pegasus, es-de]}
        contract_version: {type: integer, minimum: 1, default: 1}
        capabilities: {type: object, additionalProperties: {type: boolean}}
        support_level: {$ref: '#/components/schemas/SupportLevel'}
        evidence: {$ref: '#/components/schemas/SupportEvidence'}
        enabled: {type: boolean, default: true}
    ArtifactRecheckResult:
      type: object
      additionalProperties: false
      required: [checked, missing]
      properties:
        checked: {type: integer, minimum: 0}
        missing: {type: integer, minimum: 0}
    ImportCandidate:
      type: object
      required: [index, status, availability, available_artifacts, missing_artifacts, token, game]
      properties:
        index: {type: integer, minimum: 0, description: Display order only; never use as commit identity}
        status: {type: string, enum: [new, append, missing, duplicate, conflict]}
        reason: {type: string}
        availability: {type: string, enum: [ready, partial, missing]}
        available_artifacts: {type: integer, minimum: 0}
        missing_artifacts: {type: integer, minimum: 0}
        token: {type: string, description: Opaque signed candidate identity bound to this preview}
        game:
          type: object
          additionalProperties: true
          properties:
            platform_definition:
              $ref: '#/components/schemas/NewCustomPlatform'
              description: Present only for manifest v6 entries that require a portable custom platform; covered by the signed preview and committed atomically with selected games
            runtime_catalog:
              $ref: '#/components/schemas/PortableRuntimeCatalog'
              description: Present for kino-launches.json v2; selected custom runtime definitions and the package profile are preview-token protected and committed atomically with selected games
    ImportPreview:
      type: object
      required: [parsed, preview_token, candidates, source_diagnostics]
      properties:
        parsed: {type: integer, minimum: 0}
        preview_token: {type: string, description: Opaque signed snapshot; server restart invalidates it}
        candidates: {type: array, items: {$ref: '#/components/schemas/ImportCandidate'}}
        source_diagnostics: {type: array, items: {$ref: '#/components/schemas/ImportSourceDiagnostic'}, description: "Aggregate source-state hints only; never includes filenames, paths, sizes, hashes, passwords, or executable tool instructions"}
    ImportSourceDiagnostic:
      type: object
      required: [code, count]
      additionalProperties: false
      properties:
        code: {type: string, enum: [wrapped_archives_detected, split_archives_detected, platform_wrapped_archives_detected, platform_split_archive_parts_detected, container_inspection_limited]}
        count: {type: integer, minimum: 1}
    ImportCommitResult:
      type: object
      required: [parsed, imported, skipped, failure_policy, rom_storage, media_storage]
      properties:
        parsed: {type: integer, minimum: 0}
        imported: {type: integer, minimum: 0}
        skipped: {type: integer, minimum: 0}
        failure_policy: {type: string, const: atomic}
        rom_storage: {type: string, enum: [reference, copy]}
        media_storage: {type: string, enum: [copy, reference, ignore]}
        rom_files_copied: {type: integer, minimum: 0}
        rom_bytes_copied: {type: integer, format: int64, minimum: 0}
        media_files_copied: {type: integer, minimum: 0}
        media_bytes_copied: {type: integer, format: int64, minimum: 0}
        scan: {$ref: '#/components/schemas/SourceScan'}
    LibrarySource:
      type: object
      required: [id, name, kind, source_adapter_id, platform, rom_storage_policy, media_storage_policy, enabled, last_scan_status, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        kind: {type: string, enum: [rom_directory, pegasus, esde, kino]}
        source_adapter_id: {type: string}
        root_path: {type: string}
        metadata_path: {type: string}
        runtime_metadata_path: {type: string}
        platform: {type: string}
        metadata_locale: {type: string}
        rom_storage_policy: {type: string, enum: [reference, copy]}
        media_storage_policy: {type: string, enum: [copy, reference, ignore]}
        enabled: {type: boolean}
        last_scan_at: {type: string, format: date-time}
        last_scan_status: {type: string, enum: [never, scanning, ready, committed, failed, stale]}
        last_error: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SourceScan:
      type: object
      required: [id, source_id, status, requested_at, candidate_count, importable_count, missing_count, duplicate_count, conflict_count]
      properties:
        id: {type: string, format: uuid}
        source_id: {type: string, format: uuid}
        status: {type: string, enum: [scanning, ready, committed, failed, stale]}
        requested_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        candidate_count: {type: integer, minimum: 0}
        importable_count: {type: integer, minimum: 0}
        missing_count: {type: integer, minimum: 0}
        duplicate_count: {type: integer, minimum: 0}
        conflict_count: {type: integer, minimum: 0}
        failure_code: {type: string}
        failure_detail: {type: string}
    SourceScanPreview:
      type: object
      required: [scan, preview_token, candidates, source_diagnostics]
      properties:
        scan: {$ref: '#/components/schemas/SourceScan'}
        preview_token: {type: string, description: Opaque token; expires after 15 minutes and is not stored in plaintext}
        candidates: {type: array, items: {$ref: '#/components/schemas/ImportCandidate'}}
        source_diagnostics: {type: array, items: {$ref: '#/components/schemas/ImportSourceDiagnostic'}}
    PackageConfigTemplateInput:
      type: object
      required: [name, scope, output_path, body]
      properties:
        name: {type: string}
        scope: {type: string, enum: [package, platform, edition]}
        output_path: {type: string, description: Safe relative path ending in an allowed non-executable configuration extension}
        body: {type: string, maxLength: 65536, description: Inert text with simple scope-checked placeholders for profile/platform/game/edition/ROM and resolved device/driver/core/Android launch values; reviewed argv and executable hints are available only as JSON arrays; unavailable values are errors}
        sort_order: {type: integer}
    PortablePackageProfile:
      type: object
      required: [id, name, frontend, target, locale, file_mode, output_slug, enabled, templates]
      properties:
        id: {type: string}
        name: {type: string}
        frontend: {type: string, enum: [pegasus, es-de]}
        target: {type: string}
        device_profile_id: {type: string}
        frontend_adapter_id: {type: string}
        locale: {type: string}
        file_mode: {type: string, enum: [copy, hardlink, reference], description: Reference emits metadata-only target-root-relative paths and does not copy or own ROM/media content}
        output_slug: {type: string}
        enabled: {type: boolean, const: true}
        templates: {type: array, maxItems: 64, items: {$ref: '#/components/schemas/PackageConfigTemplateInput'}}
    SupportLevel:
      type: string
      enum: [catalogued, package-tested, hardware-tested, sync-tested]
      description: hardware-tested and sync-tested claims require structured passing evidence with device, software_version, verified_at, scope, and scenarios
    SupportEvidence:
      type: object
      additionalProperties: true
      description: Free-form notes for lower levels; hardware/sync claims require all declared properties and a passed result
      properties:
        scope: {type: string, enum: [fixture, hardware, sync]}
        device: {type: string}
        software_version: {type: string}
        verified_at: {type: string, description: YYYY-MM-DD or RFC3339}
        result: {type: string, enum: [passed]}
        scenarios: {type: array, minItems: 1, items: {type: string}}
    SourceAdapter:
      type: object
      required: [id, name, format, handler, contract_version, capabilities, support_level, evidence, builtin, enabled]
      properties:
        id: {type: string}
        name: {type: string}
        format: {type: string, description: Stable external format or specialization slug}
        handler: {type: string, enum: [rom_directory, pegasus, esde, kino], description: Audited parser compiled into the service; adapters never load executable code}
        contract_version: {type: integer, minimum: 1}
        capabilities: {type: object, additionalProperties: {type: boolean}}
        support_level: {$ref: '#/components/schemas/SupportLevel'}
        evidence: {$ref: '#/components/schemas/SupportEvidence'}
        builtin: {type: boolean}
        enabled: {type: boolean}
    FrontendAdapter:
      type: object
      required: [id, name, format, handler, contract_version, capabilities, support_level, evidence, builtin, enabled]
      properties:
        id: {type: string}
        name: {type: string}
        format: {type: string, description: Stable external format or specialization slug}
        handler: {type: string, enum: ['', pegasus, es-de], description: Audited exporter compiled into the service; an empty value is retained only for migrated legacy catalog entries and cannot be used by a PackageProfile}
        contract_version: {type: integer, minimum: 1}
        capabilities: {type: object, additionalProperties: {type: boolean}}
        support_level: {$ref: '#/components/schemas/SupportLevel'}
        evidence: {$ref: '#/components/schemas/SupportEvidence'}
        builtin: {type: boolean}
        enabled: {type: boolean}
    DriverLaunchSpec:
      type: object
      required: [arguments]
      properties:
        requires_core: {type: boolean}
        executables: {type: object, additionalProperties: {type: array, items: {type: string}}}
        android_package: {type: string}
        android_activity: {type: string}
        android_intent: {$ref: '#/components/schemas/AndroidIntentSpec'}
        arguments: {type: array, maxItems: 32, items: {type: string, maxLength: 2048}, description: Argv entries with allowlisted variables; never a shell command}
    AndroidIntentSpec:
      type: object
      required: [package]
      description: Declarative explicit Android Intent. It cannot represent or execute a shell command; the paired client renders only allowlisted local variables.
      properties:
        action: {type: string, default: android.intent.action.VIEW}
        package: {type: string}
        package_candidates:
          type: array
          maxItems: 8
          uniqueItems: true
          description: Ordered fallback application IDs for official package variants; the Android client selects the first installed package without using an implicit intent.
          items: {type: string}
        activity: {type: string}
        data: {type: string}
        mime_type: {type: string}
        categories: {type: array, items: {type: string}}
        string_extras: {type: object, additionalProperties: {type: string}}
        boolean_extras: {type: object, additionalProperties: {type: boolean}}
        flags: {type: array, items: {type: string, enum: [grant-read-uri, grant-write-uri, new-task, clear-top]}}
    DriverSaveSpec:
      type: object
      required: [scope, layout, patterns, refresh, portability]
      properties:
        scope: {type: string, enum: [game, platform, container]}
        layout: {type: string}
        patterns: {type: array, items: {type: string}}
        scope_by_platform: {type: object, additionalProperties: {type: string, enum: [game, platform, container]}}
        layout_by_platform: {type: object, additionalProperties: {type: string}}
        patterns_by_platform: {type: object, additionalProperties: {type: array, items: {type: string}}}
        refresh: {type: string}
        portability: {type: string}
    PortableFrontendAdapter:
      type: object
      required: [id, name, format, handler, contract_version, support_level, enabled]
      properties:
        id: {type: string}
        name: {type: string}
        format: {type: string}
        handler: {type: string, enum: ['', pegasus, es-de], description: Audited built-in exporter; empty is accepted only for legacy metadata that is not referenced by a portable PackageProfile}
        contract_version: {type: integer, minimum: 1}
        capabilities: {type: object, additionalProperties: {type: boolean}}
        support_level: {type: string, const: catalogued}
        enabled: {type: boolean, const: true}
    PortableDeviceProfile:
      type: object
      required: [id, name, contract_version, target, os_family, path_style, max_path, support_level, enabled]
      properties:
        id: {type: string}
        name: {type: string}
        contract_version: {type: integer, minimum: 1}
        target: {type: string}
        os_family: {type: string}
        distribution: {type: string}
        architecture: {type: string}
        path_style: {type: string, enum: [posix, windows, android-uri]}
        case_sensitive: {type: boolean}
        max_path: {type: integer, minimum: 64}
        illegal_characters: {type: string}
        supports_hardlink: {type: boolean}
        supports_hooks: {type: boolean}
        default_frontend_id: {type: string}
        paths: {type: object, additionalProperties: {type: string}, description: Portable relative target paths only}
        support_level: {type: string, const: catalogued}
        enabled: {type: boolean, const: true}
    PortableEmulatorDriver:
      type: object
      required: [id, name, family, contract_version, platforms, targets, launch, save, support_level, enabled]
      properties:
        id: {type: string}
        name: {type: string}
        family: {type: string}
        contract_version: {type: integer, minimum: 1}
        platforms: {type: array, minItems: 1, items: {type: string}}
        targets: {type: array, minItems: 1, items: {type: string}}
        launch: {$ref: '#/components/schemas/DriverLaunchSpec'}
        save: {$ref: '#/components/schemas/DriverSaveSpec'}
        config_paths: {type: object, additionalProperties: {type: string}}
        support_level: {type: string, const: catalogued}
        enabled: {type: boolean, const: true}
    PortableRetroArchCore:
      type: object
      required: [id, name, contract_version, library_names, platforms, support_level, enabled]
      properties:
        id: {type: string}
        name: {type: string}
        contract_version: {type: integer, minimum: 1}
        library_names: {type: array, minItems: 1, items: {type: string}}
        platforms: {type: array, minItems: 1, items: {type: string}}
        support_level: {type: string, const: catalogued}
        enabled: {type: boolean, const: true}
    PortableRuntimeCatalog:
      type: object
      description: Declarative, non-executable runtime definitions. Built-in ownership, timestamps, local enablement, hardware evidence, secrets, and absolute device paths are excluded.
      properties:
        frontend_adapters: {type: array, items: {$ref: '#/components/schemas/PortableFrontendAdapter'}}
        device_profiles: {type: array, items: {$ref: '#/components/schemas/PortableDeviceProfile'}}
        emulator_drivers: {type: array, items: {$ref: '#/components/schemas/PortableEmulatorDriver'}}
        retroarch_cores: {type: array, items: {$ref: '#/components/schemas/PortableRetroArchCore'}}
        package_profile: {$ref: '#/components/schemas/PortablePackageProfile'}
    Platform:
      type: object
      required: [id, name, name_zh, vendor, category, aliases, extensions, esde_systems, bios, runtime, builtin, enabled]
      properties:
        id: {type: string}
        name: {type: string}
        name_zh: {type: string}
        vendor: {type: string}
        category: {type: string, enum: [console, handheld, arcade, computer]}
        aliases: {type: array, items: {type: string}}
        extensions: {type: array, items: {type: string}}
        esde_systems: {type: array, items: {type: string}}
        bios: {type: string, enum: [none, optional, required, varies]}
        runtime: {type: string, enum: [web, web_experimental, native]}
        suggested_emulators: {type: object, additionalProperties: {type: array, items: {type: string}}}
        builtin: {type: boolean}
        enabled: {type: boolean}
    NewCustomPlatform:
      type: object
      required: [name, category]
      properties:
        id: {type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'}
        name: {type: string, minLength: 1, maxLength: 120}
        name_zh: {type: string, maxLength: 120}
        vendor: {type: string, maxLength: 120, default: Custom}
        category: {type: string, enum: [console, handheld, arcade, computer]}
        aliases: {type: array, maxItems: 64, items: {type: string}}
